<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>بوابة غزة — الرئيسية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --orange:#F97316;--orange-dark:#EA6D0E;--orange-pale:#FFF3E8;
  --text-dark:#1A1A1A;--text-mid:#4B4B4B;--text-muted:#888;
  --border:#E5E5E5;--radius-sm:8px;--radius-lg:16px;
  --shadow-btn:0 4px 14px rgba(249,115,22,.35);
}
html,body{font-family:'Tajawal',sans-serif;direction:rtl;background:#F7F7F7;color:var(--text-dark);min-height:100vh;-webkit-font-smoothing:antialiased}
.top-label{position:fixed;top:14px;right:20px;font-size:13px;color:var(--text-muted)}
.wrapper{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem}
.title{font-size:28px;font-weight:800;text-align:center;margin-bottom:2rem;animation:fadeUp .4s ease both}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;width:100%;max-width:800px;animation:fadeUp .5s ease .1s both}
.card{background:var(--orange-pale);border-radius:var(--radius-lg);padding:2rem 1.5rem 1.75rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.illus{width:100%;height:155px;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center}
.illus img{max-width:100%;max-height:100%;object-fit:contain}
.card h2{font-size:19px;font-weight:800;margin-bottom:.4rem;text-decoration:underline;text-underline-offset:3px}
.card p{font-size:14px;color:var(--text-mid);margin-bottom:1.25rem;line-height:1.6}
.btns{width:100%}
.btn-fill{display:block;width:100%;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;box-shadow:var(--shadow-btn);transition:background .2s,transform .2s}
.btn-fill:hover{background:var(--orange-dark);transform:translateY(-1px)}
.btn-out{display:block;width:100%;padding:11px;background:transparent;color:var(--text-dark);border:1.5px solid rgba(0,0,0,.15);border-radius:var(--radius-sm);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,color .2s}
.btn-out:hover{border-color:var(--orange);color:var(--orange)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.title{font-size:22px}}
</style>
</head>
<body>
<span class="top-label">الاختبار للدخول</span>
<div class="wrapper">
  <h1 class="title">أهلا بك في منصة بوابة غزة</h1>
  <div class="grid">

    <div class="card">
      <div class="illus">
        <img src="seller-image.png" alt="بوابة البائع">
      </div>
      <h2>بوابة البائع</h2>
      <p>أدر منتجاتك، تتبع مبيعاتك، ونمّ عملك.</p>
      <div class="btns">
        <button class="btn-fill" onclick="location.href='register-seller.html'">أنشئ متجري</button>
        <button class="btn-out"  onclick="location.href='login-seller.html'">تسجيل دخول</button>
      </div>
    </div>

    <div class="card">
      <div class="illus">
        <img src="buyer-image.png" alt="بوابة المشتري">
      </div>
      <h2>بوابة المشتري</h2>
      <p>تسوق، تتبع طلباتك، وتواصل مع البائعين.</p>
      <div class="btns">
        <button class="btn-fill" onclick="location.href='register-buyer.html'">أنشئ حسابي</button>
        <button class="btn-out"  onclick="location.href='login-buyer.html'">تسجيل دخول</button>
      </div>
    </div>

  </div>
</div>
</body>
</html>
