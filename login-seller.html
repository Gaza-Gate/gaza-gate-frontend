<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>بوابة غزة — تسجيل دخول البائع</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--orange:#F97316;--orange-dark:#EA6D0E;--orange-light:#FFEDD5;--text-dark:#1A1A1A;--text-mid:#4B4B4B;--text-muted:#888;--border:#E5E5E5;--radius-sm:8px;--radius-lg:16px;--shadow-card:0 2px 20px rgba(0,0,0,.08);--shadow-btn:0 4px 14px rgba(249,115,22,.35)}
html,body{font-family:'Tajawal',sans-serif;direction:rtl;background:var(--orange-light);color:var(--text-dark);min-height:100vh;-webkit-font-smoothing:antialiased}
.breadcrumb{position:fixed;top:14px;right:20px;font-size:13px;color:var(--text-muted)}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:2.5rem 2rem;width:100%;max-width:480px;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.header{text-align:center;margin-bottom:1.75rem}
.icon-row{font-size:24px;margin-bottom:.4rem;display:flex;align-items:center;justify-content:center;gap:6px}
.header p{font-size:14px;color:var(--text-muted)}
.fg{margin-bottom:1rem}
label{display:block;font-size:13px;font-weight:500;color:var(--text-mid);margin-bottom:6px;text-align:right}
.fw{position:relative}
.fi{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#bbb;display:flex;align-items:center;pointer-events:none}
input[type=email],input[type=password],input[type=text]{width:100%;padding:11px 40px 11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text-dark);font-family:'Tajawal',sans-serif;font-size:14px;direction:rtl;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
input::placeholder{color:#C5C5C5;font-size:13px}
.eye-btn{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#bbb;padding:0;display:flex;align-items:center}
.extras{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;font-size:13px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-mid);user-select:none}
.chk input{accent-color:var(--orange);width:15px;height:15px;padding:0}
.forgot{color:var(--orange);text-decoration:none;font-weight:500}
.forgot:hover{text-decoration:underline}
.btn{display:block;width:100%;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-btn);transition:background .2s,transform .2s;text-align:center;margin-bottom:1.25rem}
.btn:hover{background:var(--orange-dark);transform:translateY(-1px)}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;color:var(--text-muted);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.oauth{display:flex;justify-content:center;gap:14px;margin-bottom:1.25rem}
.ob{width:52px;height:48px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.ob:hover{border-color:#888;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.ob svg{width:22px;height:22px}
.foot{text-align:center;font-size:13px;color:var(--text-muted)}
.foot a{color:var(--orange);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<span class="breadcrumb">تسجيل الدخول للبائع</span>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div class="icon-row">🏪 مرحباً بك من جديد 👋</div>
      <p>ادخل بياناتك للوصول للوحة التحكم</p>
    </div>
    <form onsubmit="return false">
      <div class="fg">
        <label>البريد الإلكتروني</label>
        <div class="fw">
          <input type="email" placeholder="Store@gmail.com"/>
          <span class="fi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
        </div>
      </div>
      <div class="fg">
        <label>كلمة المرور</label>
        <div class="fw">
          <input type="password" id="pw1" placeholder="••••••••"/>
          <button type="button" class="eye-btn" onclick="tog('pw1',this)" aria-label="إظهار كلمة المرور">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <span class="fi" style="right:12px;left:auto"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        </div>
      </div>
      <div class="extras">
        <label class="chk"><input type="checkbox"/> تذكرني</label>
        <a href="#" class="forgot">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn">تسجيل دخول</button>
    </form>
    <div class="divider">أو</div>
    <div class="oauth">
      <button class="ob" aria-label="Google"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg></button>
      <button class="ob" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></button>
      <button class="ob" aria-label="Apple"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg></button>
    </div>
    <div class="foot">ليس عندك حساب؟ <a href="register-seller.html">إنشاء حسابي</a></div>
  </div>
</div>
<script>function tog(id,btn){var i=document.getElementById(id);i.type=i.type==='password'?'text':'password';btn.style.color=i.type==='text'?'#F97316':'#bbb'}</script>
</body>
</html>
